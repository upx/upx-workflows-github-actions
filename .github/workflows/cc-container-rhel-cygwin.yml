name: CC - container rhel cygwin
"on":
  schedule:
    - cron: 50 2 * * 2
  workflow_dispatch: null
env:
  CMAKE_REQUIRED_QUIET: "OFF"
  CMAKE_VERBOSE_MAKEFILE: "ON"
  CTEST_OUTPUT_ON_FAILURE: "ON"
  DEBIAN_FRONTEND: noninteractive
  UPX_CMAKE_CONFIG_FLAGS: -Wdev --warn-uninitialized
  UPX_CONFIG_EXPECT_THREADS: "ON"
  UPX_DEBUG_TEST_FLOAT_DIVISION_BY_ZERO: 1
  UPX_DEBUG_TEST_LIBC_QSORT: 1
  VERBOSE: 1
  REMOTE_REF_NAME: devel
  REMOTE_REF_TYPE: branch
  REMOTE_REPOSITORY: upx/upx-workflows-github-weekly
  REMOTE_SERVER_URL: https://github.com
  REMOTE_SHA: "0000000000000000000000000000000000000000"
jobs:
  cygwin:
    if: github.repository_owner == 'upx'
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - container: almalinux:8
          - container: almalinux:9
          - container: quay.io/centos/centos:centos7
            is_rhel_7: true
          - container: quay.io/centos/centos:stream8
          - container: quay.io/centos/centos:stream9
          - container: quay.io/centos/centos:stream9-minimal
          - container: rockylinux:8
          - container: rockylinux:9
          - container: registry.access.redhat.com/ubi8/ubi-minimal
          - container: registry.access.redhat.com/ubi9/ubi-minimal
    env:
      xflags: -static -D_GLIBCXX_DEFINE_STDEXCEPT_COPY_OPS
      CMAKE_SYSTEM_NAME: CYGWIN
      CMAKE_CROSSCOMPILING_EMULATOR: wine
    steps:
      - name: Display environment
        run: |
          uname -a; pwd; id; umask
          env | LC_ALL=C sort
          rpm -qa | LC_ALL=C sort
      - name: ${{ format('Install system packages {0}', matrix.container) }}
        if: ${{ matrix.is_rhel_7 }}
        run: |
          yum update -y && yum install -y epel-release # for cmake3
          yum install -y bash cmake3 diffutils file git make tar yum-plugin-copr
          ln -s -v cmake3 /usr/bin/cmake
          ln -s -v ctest3 /usr/bin/ctest
          ln -s -v yum /usr/bin/dnf
      - name: ${{ format('Install system packages {0}', matrix.container) }}
        if: ${{ !matrix.is_rhel_7 }}
        run: |
          if ! test -f /usr/bin/dnf; then microdnf update -y && microdnf install -y dnf; fi
          dnf update -y && dnf install -y bash cmake diffutils dnf-plugins-core file git make tar
      - name: Install cygwin
        run: |
          dnf copr -y enable yselkowitz/cygwin
          dnf install -y cygwin32-gcc-c++ cygwin64-gcc-c++
      - name: ${{ format('Check out {0}/{1} {2} {3} source code', env.REMOTE_SERVER_URL, env.REMOTE_REPOSITORY, env.REMOTE_REF_TYPE, env.REMOTE_REF_NAME) }}
        run: |
          # git config
          git config --global core.autocrlf false
          git config --global --add safe.directory '*'
          # install Self, needed for config file below
          ##git clone --branch "$GITHUB_REF_NAME" --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" ../Self

          git clone --branch "$REMOTE_REF_NAME" --depth 1 "$REMOTE_SERVER_URL/$REMOTE_REPOSITORY" .
          test -f ./.gitmodules && git submodule update --init
          # TODO: handle REMOTE_REF_TYPE == "tag"
          # update environment
          rev="$(git rev-parse HEAD)"
          echo "REMOTE_SHA=$rev" >> $GITHUB_ENV
      - run: make UPX_XTARGET=cygwin32 xtarget/debug   CC="i686-pc-cygwin-gcc $xflags"   CXX="i686-pc-cygwin-g++ $xflags"
      - run: make UPX_XTARGET=cygwin32 xtarget/release CC="i686-pc-cygwin-gcc $xflags"   CXX="i686-pc-cygwin-g++ $xflags"
      - run: make UPX_XTARGET=cygwin64 xtarget/debug   CC="x86_64-pc-cygwin-gcc $xflags" CXX="x86_64-pc-cygwin-g++ $xflags"
      - run: make UPX_XTARGET=cygwin64 xtarget/release CC="x86_64-pc-cygwin-gcc $xflags" CXX="x86_64-pc-cygwin-g++ $xflags"
      - name: Inspect binaries
        run: |
          ls -l build/*/*/upx.exe
          size build/*/*/upx.exe || true
          file build/*/*/upx.exe
