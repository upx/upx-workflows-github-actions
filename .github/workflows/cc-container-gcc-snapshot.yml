name: CC - container gcc-snapshot
"on":
  schedule:
    - cron: 40 2 * * 2
  workflow_dispatch: null
env:
  CMAKE_REQUIRED_QUIET: "OFF"
  CMAKE_VERBOSE_MAKEFILE: "ON"
  CTEST_OUTPUT_ON_FAILURE: "ON"
  DEBIAN_FRONTEND: noninteractive
  UPX_CMAKE_CONFIG_FLAGS: -Wdev --warn-uninitialized
  UPX_CONFIG_EXPECT_THREADS: "ON"
  UPX_DEBUG_TEST_FLOAT_DIVISION_BY_ZERO: 1
  UPX_DEBUG_TEST_LIBC_QSORT: 1
  VERBOSE: 1
  REMOTE_REF_NAME: test-threads
  REMOTE_REF_TYPE: branch
  REMOTE_REPOSITORY: upx/upx-test-threads
  REMOTE_SERVER_URL: https://github.com
  REMOTE_SHA: "0000000000000000000000000000000000000000"
jobs:
  gcc-14:
    if: false
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - container: ubuntu:24.04
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - name: Display environment
        run: |
          uname -a; pwd; id; umask
          env | LC_ALL=C sort
          dpkg -l
      - name: ${{ format('Install packages {0}', matrix.container) }}
        run: |
          apt-get update && apt-get upgrade -y
          apt-get install -y bash cmake file git make parallel qemu-user valgrind
          apt-get install -y g++-14-multilib
          mkdir -p ~/.parallel && : > ~/.parallel/$(echo 6305-4721 | tr 0-7 leticlwi)
      - run: set -x; $CC --version; $CXX --version
      - run: $CC  -E -x c   -dM /dev/null
      - run: $CXX -E -x c++ -dM /dev/null
      - name: ${{ format('Check out {0}/{1} {2} {3} source code', env.REMOTE_SERVER_URL, env.REMOTE_REPOSITORY, env.REMOTE_REF_TYPE, env.REMOTE_REF_NAME) }}
        run: |
          # git config
          git config --global core.autocrlf false
          git config --global --add safe.directory '*'
          # install Self, needed for config file below
          ##git clone --branch "$GITHUB_REF_NAME" --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" ../Self

          git clone --branch "$REMOTE_REF_NAME" --depth 1 "$REMOTE_SERVER_URL/$REMOTE_REPOSITORY" .
          test -f ./.gitmodules && git submodule update --init
          # TODO: handle REMOTE_REF_TYPE == "tag"
          # update environment
          rev="$(git rev-parse HEAD)"
          echo "REMOTE_SHA=$rev" >> $GITHUB_ENV
      - name: ${{ format('Build Debug with {0} and {1}', env.CC, env.CXX) }}
        run: make build/debug
      - name: ${{ format('Build Release with {0} and {1}', env.CC, env.CXX) }}
        run: make build/release
      - run: make build/extra/gcc-m32/all+test CC="$CC -m32" CXX="$CXX -m32"
      - name: Inspect binaries
        run: |
          ls -l build/*/upx
          size build/*/upx
          file build/*/upx
      - name: Run tests
        run: |
          make build/debug+test
          make build/release+test
          if test -f ./misc/testsuite/test_symlinks.sh; then true;
            apt-get install -y sudo
            # IMPORTANT: do NOT run as user root!
            (cd build/release && chmod a+w . && sudo -u nobody bash ../../misc/testsuite/test_symlinks.sh)
          fi
          true
      - name: Mimic ctest tests
        run: |
          if test -f ./misc/testsuite/mimic_ctest.sh; then true;
            (cd build/debug && bash ../../misc/testsuite/mimic_ctest.sh)
            (cd build/release && bash ../../misc/testsuite/mimic_ctest.sh)
          fi
          true
      - name: Mimic ctest tests QEMU
        if: ${{ !matrix.skip_qemu }}
        run: |
          if test -f ./misc/testsuite/mimic_ctest.sh; then true;
            case "${{ matrix.container }}" in
              i386/*) export upx_exe_runner=qemu-i386 ;;
              *)      export upx_exe_runner=qemu-x86_64 ;;
            esac
            jobs="debug release"
            echo "===== parallel jobs: $jobs"
            parallel -kv --lb 'cd build/{} && bash ../../misc/testsuite/mimic_ctest.sh' ::: $jobs
          fi
          true
      - name: Mimic ctest tests Valgrind
        if: ${{ !matrix.skip_valgrind }}
        run: |
          if test -f ./misc/testsuite/mimic_ctest.sh; then true;
            export upx_exe_runner="valgrind --leak-check=no --error-exitcode=1 --quiet --gen-suppressions=all"
            jobs="debug release"
            echo "===== parallel jobs: $jobs"
            parallel -kv --lb 'cd build/{} && bash ../../misc/testsuite/mimic_ctest.sh' ::: $jobs
          fi
          true
  gcc-latest-rhel:
    if: github.repository_owner == 'upx'
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - container: almalinux:8
          - container: almalinux:9
          - container: quay.io/centos/centos:stream9
          - container: quay.io/centos/centos:stream9-minimal
          - container: rockylinux:8
          - container: rockylinux:9
          - container: registry.access.redhat.com/ubi8/ubi-minimal
            skip_valgrind: true
          - container: registry.access.redhat.com/ubi9/ubi-minimal
            skip_valgrind: true
    env:
      CC: /opt/gcc-latest/bin/gcc
      CXX: /opt/gcc-latest/bin/g++ -static-libstdc++
    steps:
      - name: Display environment
        run: |
          uname -a; pwd; id; umask
          env | LC_ALL=C sort
          rpm -qa | LC_ALL=C sort
      - name: ${{ format('Install system packages {0}', matrix.container) }}
        if: ${{ matrix.is_rhel_7 }}
        run: |
          yum update -y && yum install -y epel-release # for cmake3 and parallel
          yum install -y bash cmake3 diffutils file git make parallel tar yum-plugin-copr
          mkdir -p ~/.parallel && : > ~/.parallel/$(echo 6305-4721 | tr 0-7 leticlwi)
          ln -s -v cmake3 /usr/bin/cmake
          ln -s -v ctest3 /usr/bin/ctest
          ln -s -v yum /usr/bin/dnf
      - name: ${{ format('Install system packages {0}', matrix.container) }}
        if: ${{ !matrix.is_rhel_7 }}
        run: |
          if ! test -f /usr/bin/dnf; then microdnf update -y && microdnf install -y dnf; fi
          dnf update -y && dnf install -y bash cmake diffutils dnf-plugins-core file git make tar
          mkdir -p ~/.parallel && : > ~/.parallel/$(echo 6305-4721 | tr 0-7 leticlwi)
      - name: Install gcc-latest
        run: |
          dnf copr -y enable jwakely/gcc-latest
          dnf install -y gcc-latest glibc-devel
          #rpm -ql gcc-latest
      - run: dnf install -y valgrind
        if: ${{ !matrix.skip_valgrind }}
      - run: set -x; $CC --version; $CXX --version
      - run: $CC  -E -x c   -dM /dev/null
      - run: $CXX -E -x c++ -dM /dev/null
      - name: ${{ format('Check out {0}/{1} {2} {3} source code', env.REMOTE_SERVER_URL, env.REMOTE_REPOSITORY, env.REMOTE_REF_TYPE, env.REMOTE_REF_NAME) }}
        run: |
          # git config
          git config --global core.autocrlf false
          git config --global --add safe.directory '*'
          # install Self, needed for config file below
          ##git clone --branch "$GITHUB_REF_NAME" --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" ../Self

          git clone --branch "$REMOTE_REF_NAME" --depth 1 "$REMOTE_SERVER_URL/$REMOTE_REPOSITORY" .
          test -f ./.gitmodules && git submodule update --init
          # TODO: handle REMOTE_REF_TYPE == "tag"
          # update environment
          rev="$(git rev-parse HEAD)"
          echo "REMOTE_SHA=$rev" >> $GITHUB_ENV
      - name: ${{ format('Build Debug with {0} and {1}', env.CC, env.CXX) }}
        run: make build/debug
      - name: ${{ format('Build Release with {0} and {1}', env.CC, env.CXX) }}
        run: make build/release
      - name: Inspect binaries
        run: |
          ls -l build/*/upx
          size build/*/upx
          file build/*/upx
      - name: Run tests
        run: |
          make build/debug+test
          make build/release+test
          # TODO: allow overriding $test_file in test_symlinks.sh
          if test -f ./misc/testsuite/test_symlinks.sh; then true;
            dnf install -y sudo
            # IMPORTANT: do NOT run as user root!
            (cd build/release && chmod a+w . && sudo -u nobody bash ../../misc/testsuite/test_symlinks.sh)
          fi
          true
      - name: Mimic ctest tests
        run: |
          if test -f ./misc/testsuite/mimic_ctest.sh; then true;
            jobs="debug release"
            if command -v parallel >/dev/null; then
              echo "===== parallel jobs: $jobs"
              parallel -kv --lb 'cd build/{} && bash ../../misc/testsuite/mimic_ctest.sh' ::: $jobs
            else
              for job in $jobs; do
                (cd build/$job && bash ../../misc/testsuite/mimic_ctest.sh)
              done
            fi
          fi
          true
      - name: Mimic ctest tests Valgrind
        if: ${{ !matrix.skip_valgrind }}
        run: |
          if test -f ./misc/testsuite/mimic_ctest.sh; then true;
            export upx_exe_runner="valgrind --leak-check=no --error-exitcode=1 --quiet --gen-suppressions=all"
            jobs="debug release"
            if command -v parallel >/dev/null; then
              echo "===== parallel jobs: $jobs"
              parallel -kv --lb 'cd build/{} && bash ../../misc/testsuite/mimic_ctest.sh' ::: $jobs
            else
              for job in $jobs; do
                (cd build/$job && bash ../../misc/testsuite/mimic_ctest.sh)
              done
            fi
          fi
          true
